# A version tag (0.1.0) publishes dev.midge:sdk:<version> to Maven Central (signed bundle through the Central Portal
# API, released automatically after validation) and to this repository's GitHub Packages.
# Secrets: MAVEN_CENTRAL_USERNAME / MAVEN_CENTRAL_PASSWORD (Central Portal user token), MIDGE_SIGNING_KEY (ASCII-armored
# private key of "Midge SDK <noreply@midge.dev>", BBB7ADDF…944853C9) and MIDGE_SIGNING_PASSWORD.
name: Publish
on:
  push:
    tags: ['*.*.*']
  # By hand for a tag already there (GitHub doesn't run workflows on a repository's very first push).
  workflow_dispatch:
    inputs:
      version: { description: 'Version tag to publish, e.g. 0.1.0', required: true }
permissions:
  contents: read
  packages: write
jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      MIDGE_SDK_VERSION: ${{ inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: '${{ inputs.version || github.ref }}' }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      # GitHub's Ubuntu runners come with the Android SDK (ANDROID_HOME); Gradle fetches the platform it needs.
      - name: Test, sign and stage
        run: ./gradlew :midge:testDebugUnitTest :midge:publishReleasePublicationToCentralStagingRepository
        env:
          MIDGE_SIGNING_KEY: ${{ secrets.MIDGE_SIGNING_KEY }}
          MIDGE_SIGNING_PASSWORD: ${{ secrets.MIDGE_SIGNING_PASSWORD }}
      - name: Upload to Maven Central
        run: |
          cd midge/build/central-staging
          find . -name 'maven-metadata*' -delete
          zip -qr "$RUNNER_TEMP/bundle.zip" .
          auth=$(printf '%s:%s' "$MAVEN_CENTRAL_USERNAME" "$MAVEN_CENTRAL_PASSWORD" | base64 -w0)
          id=$(curl -sSf -X POST -H "Authorization: Bearer $auth" -F "bundle=@$RUNNER_TEMP/bundle.zip" \
            "https://central.sonatype.com/api/v1/publisher/upload?name=dev.midge:sdk:$MIDGE_SDK_VERSION&publishingType=AUTOMATIC")
          echo "deployment $id"
          for i in $(seq 1 60); do
            state=$(curl -sSf -X POST -H "Authorization: Bearer $auth" \
              "https://central.sonatype.com/api/v1/publisher/status?id=$id" | jq -r .deploymentState)
            echo "state $state"
            case "$state" in PUBLISHING|PUBLISHED) exit 0 ;; FAILED) exit 1 ;; esac
            sleep 20
          done
          exit 1
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
      - name: Publish to GitHub Packages
        run: ./gradlew :midge:publishReleasePublicationToGitHubPackagesRepository
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MIDGE_SIGNING_KEY: ${{ secrets.MIDGE_SIGNING_KEY }}
          MIDGE_SIGNING_PASSWORD: ${{ secrets.MIDGE_SIGNING_PASSWORD }}
