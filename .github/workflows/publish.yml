# A version tag (0.1.0) publishes dev.midge:sdk:<version> to this repository's GitHub Packages.
name: Publish
on:
  push:
    tags: ['*.*.*']
  # By hand for a tag already there (GitHub doesn't run workflows on a repository's very first push).
  workflow_dispatch:
    inputs:
      version: { description: 'Version tag to publish, e.g. 0.1.0', required: true }
permissions:
  contents: read
  packages: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: '${{ inputs.version || github.ref }}' }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      # GitHub's Ubuntu runners come with the Android SDK (ANDROID_HOME); Gradle fetches the platform it needs.
      - run: ./gradlew :midge:testDebugUnitTest :midge:publishReleasePublicationToGitHubPackagesRepository
        env:
          MIDGE_SDK_VERSION: ${{ inputs.version || github.ref_name }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
